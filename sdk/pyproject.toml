[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drobo-nasd"
version = "1.2.0"
description = "Talk to a Drobo NAS. The protocol, recovered from firmware and confirmed against real hardware."
readme = "README.md"
requires-python = ">=3.10"
# GPL-3.0-or-later, the project's licence since 2026-10-19; the full text
# is LICENSE at the repository root. Written in the table form because
# the setuptools floor above (>=68) does not accept PEP 639's plain SPDX
# string; the classifier below says the same for tools that read it.
license = { text = "GPL-3.0-or-later" }
keywords = ["drobo", "nas", "storage", "beyondraid", "nasd"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
  "Topic :: System :: Monitoring",
]

# No dependencies, deliberately. This talks to hardware whose vendor no longer
# exists; anything it depended on would be one more thing that can rot before
# the Drobo does. Standard library only.
dependencies = []

[project.urls]
# Where the source is published.
Source = "https://github.com/LoopEriksen/Drobo-Dashboard-REBORN"

[tool.setuptools.packages.find]
include = ["drobo_nasd*"]
