name: Tester report
description: Tell us what happened when you ran Drobo Dashboard REBORN on your own setup.
title: "[Tester] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. **Issues here are public**, so read what you
        paste before you send it. The tester guide,
        [`windows/installer/TESTING.md`](https://github.com/LoopEriksen/Drobo-Dashboard-REBORN/blob/main/windows/installer/TESTING.md),
        covers installing, first run and what a useful report holds.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The Tools tab shows it; so does the footer of the browser dashboard and the name of the MSI you downloaded.
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you ran it
      options:
        - The installer (the MSI from the Releases page)
        - From source (START DROBO DASHBOARD.bat or run_agent.py)
        - The simulated Drobo (START WITH SIMULATED DROBO (testing).bat)
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: What you used
      options:
        - The Windows app
        - The browser dashboard
        - Both
    validations:
      required: true
  - type: input
    id: drobo-model
    attributes:
      label: Drobo model
      description: On the Status tab, or at the top of the browser dashboard. Write "simulated" if you used the simulated Drobo.
      placeholder: e.g. Drobo 5N
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: In the same places as the model.
      placeholder: e.g. 4.2.2
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings > System > About. Say whether Smart App Control is on, if you know.
      placeholder: e.g. Windows 11 24H2
  - type: textarea
    id: what-you-did
    attributes:
      label: What you did
      description: The steps, in order, so someone else could do the same.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: The exact words of any message help most.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Optional. In the app, Tools > Copy diagnostics, or what the agent's
        window printed. **Read it first and remove serial numbers (the
        Drobo's own and every drive's), IP and MAC addresses, the Drobo's
        name, share names and your Windows user name** (the agent's window
        can print a path such as C:\Users\your-name\AppData\...). It never
        contains a password or the access token, but it can contain those.
        Never paste a packet capture: it can carry your Drobo password in
        plain text.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed serial numbers, IP and MAC addresses, the Drobo's name, share names and my Windows user name from everything above
          required: true
        - label: I have not attached a packet capture (it can hold the Drobo's password)
          required: true
