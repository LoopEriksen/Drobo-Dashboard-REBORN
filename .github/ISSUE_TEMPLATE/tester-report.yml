name: Tester report
description: Tell us what happened when you ran Drobo Dashboard REBORN on your own setup.
title: "[Tester] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. **Issues here are public**, so read what you
        paste before you send it. The tester guide,
        [`windows/installer/TESTING.md`](https://github.com/LoopEriksen/Drobo-Dashboard-REBORN/blob/main/windows/installer/TESTING.md),
        covers installing, first run and what a useful report holds.
        Something you would rather not post publicly goes through the
        private route in
        [`SECURITY.md`](https://github.com/LoopEriksen/Drobo-Dashboard-REBORN/blob/main/SECURITY.md)
        instead.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The Tools tab shows it; so does the footer of the browser dashboard and the name of the MSI you downloaded.
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you ran it
      options:
        - The installer (the MSI from the Releases page)
        - From source (START DROBO DASHBOARD.bat or run_agent.py)
        - The simulated Drobo (START WITH SIMULATED DROBO (testing).bat)
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: What you used
      options:
        - The Windows app
        - The browser dashboard
        - Both
    validations:
      required: true
  - type: dropdown
    id: found-drobo
    attributes:
      label: Did it find your Drobo?
      options:
        - By itself
        - Only after I typed its address
        - "No"
  - type: input
    id: drobo-model
    attributes:
      label: Drobo model
      description: On the Status tab, or at the top of the browser dashboard. Write "simulated" if you used the simulated Drobo.
      placeholder: e.g. Drobo 5N
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Firmware version
      description: In the same places as the model.
      placeholder: e.g. 4.2.2
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings > System > About. Say whether Smart App Control is on, if you know.
      placeholder: e.g. Windows 11 24H2
  - type: textarea
    id: what-you-did
    attributes:
      label: What you did
      description: The steps, in order, so someone else could do the same.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: The exact words of any message help most.
    validations:
      required: true
  - type: checkboxes
    id: changes-made
    attributes:
      label: What did you change on the Drobo?
      description: Tick everything you used, even if it seemed to work. Share create, share delete and DroboApps start/stop are not yet proven on a real Drobo, so those reports matter most.
      options:
        - label: Nothing
        - label: Identify (the front lights)
        - label: LED brightness
        - label: Drive spin-down
        - label: Share access
        - label: Created a share
        - label: Deleted a share
        - label: Started or stopped a DroboApp
  - type: textarea
    id: write-result
    attributes:
      label: What did the app say about it?
      description: For each change, the colour of the result line (green, amber or red) and its exact words. For Identify, whether the lights blinked.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Optional. In the app, Tools > Copy diagnostics, or what the agent's
        window printed. Copy diagnostics already replaces serial numbers,
        names and addresses with placeholders; do not paste the unmasked
        copy. Give it a quick read all the same. Version 1.2.0's Copy
        diagnostics is not masked, and neither is the agent's window:
        **from those, remove serial numbers (the Drobo's own and every
        drive's), IP and MAC addresses, the Drobo's name, share names and
        your Windows user name by hand** (the agent's window can print a
        path such as C:\Users\your-name\AppData\...). None of them
        contains a password or the access token. Never paste a packet
        capture: it can carry your Drobo password in plain text.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I used the copy made for posting (Copy diagnostics), or removed serial numbers, IP and MAC addresses, the Drobo's name, share names and my Windows user name by hand
          required: true
        - label: I have not attached a packet capture (it can hold the Drobo's password)
          required: true
